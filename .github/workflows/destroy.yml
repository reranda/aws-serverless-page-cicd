name: Destroy application

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Application environment to remove; bootstrap state and identities are retained
        required: true
        type: choice
        options: [dev, prod]
        default: dev
      confirmation:
        description: Type DESTROY dev or DESTROY prod exactly
        required: true
        type: string

permissions:
  contents: read

jobs:
  destroy:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/terraform.yml
    with:
      environment: ${{ inputs.environment }}
      operation: destroy
      confirmation: ${{ inputs.confirmation }}
