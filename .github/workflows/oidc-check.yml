name: OIDC subject check
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  subject:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - name: Read subject and audience without AWS access
        run: python scripts/oidc_subject.py

