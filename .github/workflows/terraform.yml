name: Reviewed Terraform release

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      operation:
        required: true
        type: string
      confirmation:
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: terraform-${{ inputs.environment }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  CONFIG_JSON: ${{ inputs.environment == 'dev' && vars.DEV_CONFIG_JSON || vars.PROD_CONFIG_JSON }}
  DEPLOYMENT_CONTROLS_READY: ${{ vars.DEPLOYMENT_CONTROLS_READY }}
  TARGET_ENVIRONMENT: ${{ inputs.environment }}
  OPERATION: ${{ inputs.operation }}
  CONFIRMATION: ${{ inputs.confirmation }}

jobs:
  plan:
    name: Plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: '1.16.5'
          terraform_wrapper: false
      - name: Validate trusted source and operation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/release_guard.py --environment "$TARGET_ENVIRONMENT" --operation "$OPERATION" --confirmation "$CONFIRMATION"
          python -m pip install -r requirements-release.txt
          python scripts/build.py --commit "$GITHUB_SHA"
          python scripts/prepare.py --environment "$TARGET_ENVIRONMENT" --role plan
      - name: Verify dev before production promotion
        if: inputs.operation == 'deploy' && inputs.environment == 'prod'
        env:
          DEV_CONFIG_JSON: ${{ vars.DEV_CONFIG_JSON }}
        run: |
          DEV_URL=$(python -c 'import json, os; c=json.loads(os.environ["DEV_CONFIG_JSON"]); print("https://"+c["rest_api_id"]+".execute-api."+c["region"]+".amazonaws.com/dev")')
          python scripts/smoke.py --url "$DEV_URL"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
          role-session-name: plan-${{ github.run_id }}
      - name: Save the plan and a review summary
        working-directory: infrastructure/app
        run: |
          terraform init -backend-config=../../build/backend.hcl -lockfile=readonly
          PLAN_ARGS=()
          if [ "$OPERATION" = destroy ]; then PLAN_ARGS+=(-destroy); fi
          terraform plan "${PLAN_ARGS[@]}" -var-file=../../build/app.auto.tfvars.json -out=../../build/tfplan -no-color
          {
            echo "### Reviewed Terraform plan"
            echo "Operation: $OPERATION; environment: $TARGET_ENVIRONMENT; source: $GITHUB_SHA"
            echo 'Review the Plan job output before approving Apply. The saved binary plan is encrypted.'
            echo 'The plan expires after six hours. A changed main branch requires a new run.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Encrypt the exact plan, configuration and package
        run: python scripts/plan_bundle.py seal --environment "$TARGET_ENVIRONMENT" --commit "$GITHUB_SHA" --operation "$OPERATION" --run-id "$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: encrypted-plan-${{ inputs.environment }}-${{ github.run_id }}
          path: |
            build/bundle.enc
            build/envelope.json
          retention-days: 1
          if-no-files-found: error

  apply:
    name: Apply
    needs: plan
    environment:
      name: ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: '1.16.5'
          terraform_wrapper: false
      - name: Validate trusted source and prepare the deployment identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/release_guard.py --environment "$TARGET_ENVIRONMENT" --operation "$OPERATION" --confirmation "$CONFIRMATION"
          python -m pip install -r requirements-release.txt
          python scripts/prepare.py --environment "$TARGET_ENVIRONMENT" --role deploy
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
          role-session-name: apply-${{ github.run_id }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: encrypted-plan-${{ inputs.environment }}-${{ github.run_id }}
          path: build
      - name: Decrypt and verify the approved plan
        run: python scripts/plan_bundle.py unseal --environment "$TARGET_ENVIRONMENT" --commit "$GITHUB_SHA" --operation "$OPERATION" --run-id "$GITHUB_RUN_ID"
      - name: Apply the saved plan
        working-directory: infrastructure/app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          terraform init -backend-config=../../build/backend.hcl -lockfile=readonly
          python ../../scripts/release_guard.py --environment "$TARGET_ENVIRONMENT" --operation "$OPERATION" --confirmation "$CONFIRMATION"
          terraform apply -input=false -no-color ../../build/tfplan
          terraform output -json > ../../build/outputs.json
      - name: Verify the running release and infrastructure convergence
        if: inputs.operation == 'deploy'
        run: |
          API_URL=$(python -c 'import json; print(json.load(open("build/outputs.json"))["api_url"]["value"])')
          python scripts/smoke.py --url "$API_URL"
          terraform -chdir=infrastructure/app plan -var-file=../../build/app.auto.tfvars.json -detailed-exitcode -no-color
          echo "Verified release $GITHUB_SHA in $TARGET_ENVIRONMENT: $API_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Record application destruction
        if: inputs.operation == 'destroy'
        run: echo "Removed application resources in $TARGET_ENVIRONMENT. Bootstrap state, keys, API containers and IAM identities remain." >> "$GITHUB_STEP_SUMMARY"
