name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: '1.16.5'
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6
        with:
          tflint_version: v0.64.0
      - name: Install pinned tooling
        run: python -m pip install -r requirements-tools.txt
      - name: Test application, release controls and deterministic packaging
        run: |
          python -m unittest discover -s tests -v
          python scripts/build.py --commit "$GITHUB_SHA"
      - name: Check Terraform formatting and validation
        run: |
          terraform fmt -check -recursive
          for directory in infrastructure/bootstrap infrastructure/app; do
            terraform -chdir="$directory" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$directory" validate -no-color
            terraform -chdir="$directory" test -no-color
            tflint --chdir="$directory" --config="$GITHUB_WORKSPACE/.tflint.hcl"
          done
      - name: Scan infrastructure with documented exceptions
        run: checkov --config-file .checkov.yaml
