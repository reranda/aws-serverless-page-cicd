name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: '1.16.5'
          terraform_wrapper: false
      - name: Test the packaged page and deployment guards
        run: |
          python -m unittest discover -s tests -v
          python scripts/build.py --commit "$GITHUB_SHA"
      - name: Validate Terraform and security controls without AWS credentials
        run: |
          terraform fmt -check -recursive
          for directory in infrastructure/bootstrap infrastructure/app; do
            terraform -chdir="$directory" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$directory" validate -no-color
            terraform -chdir="$directory" test -no-color
          done
      - name: Scan the documented infrastructure security baseline
        run: |
          python -m pip install -r requirements-tools.txt
          checkov --config-file .checkov.yaml

