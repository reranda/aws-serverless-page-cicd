name: Inspect OIDC claims

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  main-subject:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: python3 scripts/oidc_claims.py
  environment-subject:
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        environment: [dev, prod]
    environment: ${{ matrix.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: python3 scripts/oidc_claims.py
