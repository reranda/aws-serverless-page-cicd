name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment; validate dev before promoting the same commit to prod
        required: true
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/terraform.yml
    with:
      environment: ${{ inputs.environment }}
      operation: deploy
